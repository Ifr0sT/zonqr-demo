<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ZonQR" />
  <title>ZonQR — Directorio local</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/icon.svg" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <a href="promo.html" class="logo"><span class="logo-icon">QR</span> ZonQR</a>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="search-input" placeholder="Buscar negocio, comida, gym..." autocomplete="off" />
    </div>
    <div class="zone-badge"><span class="dot"></span> Zona Centro</div>
  </header>
  <main class="main">
    <div class="toolbar">
      <div class="view-toggle">
        <button type="button" data-view="list" class="active">Lista</button>
        <button type="button" data-view="map">Mapa</button>
      </div>
      <div class="categories" id="categories"></div>
      <span class="result-count" id="result-count"></span>
    </div>
    <div class="list-view" id="list-view"></div>
    <div class="map-view" id="map-view">
      <div id="map-loading" class="map-loading">Cargando mapa…</div>
      <div id="map"></div>
    </div>
  </main>
  <footer class="app-footer">
    <a href="promo.html">¿Quieres ZonQR en tu zona?</a><span class="sep">·</span><a href="privacidad.html">Privacidad</a>
  </footer>
  <div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal-content"></div></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="js/config.js"></script>
  <script src="js/data1.js"></script>
  <script src="js/data2.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

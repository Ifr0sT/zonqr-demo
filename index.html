<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <meta name="description" content="ZonQR — Directorio local activado por QR. Encuentra negocios cercanos, lee reseñas y contacta por WhatsApp." />
  <meta name="application-name" content="ZonQR" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ZonQR" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>ZonQR — Directorio local</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <a href="#" class="logo" aria-label="ZonQR inicio">
      <span class="logo-icon">QR</span>
      ZonQR
    </a>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
      </svg>
      <input type="search" id="search-input" placeholder="Buscar negocio, comida, gym..." autocomplete="off" />
    </div>
    <div class="zone-badge">
      <span class="dot"></span>
      Zona Centro
    </div>
  </header>
  <main class="main">
    <div class="toolbar">
      <div class="view-toggle" role="group" aria-label="Vista">
        <button type="button" data-view="list" class="active">Lista</button>
        <button type="button" data-view="map">Mapa</button>
      </div>
      <div class="categories" id="categories" role="tablist" aria-label="Categorías"></div>
      <span class="result-count" id="result-count"></span>
    </div>
    <div class="list-view" id="list-view"></div>
    <div class="map-view" id="map-view">
      <div id="map-loading" class="map-loading">Cargando mapa…</div>
      <div id="map"></div>
    </div>
  </main>
  <footer class="app-footer">
    <a href="promo.html">¿Quieres ZonQR en tu zona?</a>
    <span class="sep">·</span>
    <a href="admin.html">Admin</a>
    <span class="sep">·</span>
    <a href="privacidad.html">Privacidad</a>
  </footer>
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal" id="modal-content"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="offline-badge" id="offline-badge" aria-live="polite">Sin conexión · modo offline</div>
  <div class="install-banner" id="install-banner" role="dialog" aria-label="Instalar ZonQR">
    <div class="install-banner-icon">Z</div>
    <div class="install-banner-text">
      <strong>Instalar ZonQR</strong>
      <span>Acceso rápido desde tu pantalla de inicio</span>
    </div>
    <div class="install-banner-actions">
      <button type="button" class="btn-dismiss" id="install-dismiss">Ahora no</button>
      <button type="button" class="btn-install" id="install-btn">Instalar</button>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

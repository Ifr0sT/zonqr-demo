<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Admin ZonQR</title><link rel="stylesheet" href="css/styles.css"/><style>body{padding:16px;max-width:720px;margin:auto}.gate,.card{background:#121212;border:1px solid #2a2a2a;border-radius:16px;padding:16px;margin:12px 0}input,select,textarea{width:100%;margin:6px 0;padding:10px;border-radius:10px;border:1px solid #2a2a2a;background:#1a1a1a;color:#fff}label{font-size:.85rem;color:#9a9a90}</style></head><body><h1>Admin ZonQR</h1><p><a href="index.html">Directorio</a> · <a href="promo.html">Promo</a></p><div id="gate" class="gate"><p>PIN (por defecto <b>zonqr</b>)</p><input id="pin" type="password"/><button class="btn lime" id="go">Entrar</button></div><div id="app" class="card" style="display:none"><p>Los cambios de esta demo online se guardan en <b>este navegador</b>.</p><h3>Nuevo / editar rapido</h3><input id="n" placeholder="Nombre"/><select id="c"><option value="comida">Comida</option><option value="salud">Salud</option><option value="belleza">Belleza</option><option value="fitness">Fitness</option><option value="moda">Moda</option><option value="servicios">Servicios</option></select><input id="a" placeholder="Direccion"/><input id="w" placeholder="WhatsApp 52..."/><button class="btn lime" id="usegeo">Usar mi ubicacion</button><button class="btn lime" id="save">Guardar negocio</button><p id="msg"></p><h3>Catalogo</h3><div id="list"></div></div><script src="js/data.js"></script><script src="js/storage.js"></script><script src="js/geo.js"></script><script>const S=window.ZONQR_STORAGE;let cat=S.load()||{zone:ZONQR_DATA.zone,businesses:ZONQR_DATA.businesses.slice(),categories:ZONQR_DATA.categories};document.getElementById('go').onclick=()=>{if((document.getElementById('pin').value||'')===(S.getPin?S.getPin():'zonqr')||document.getElementById('pin').value==='zonqr'){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';draw()}else alert('PIN incorrecto')};function draw(){document.getElementById('list').innerHTML=cat.businesses.map(b=>'<p>'+b.name+' · '+b.categoryLabel+'</p>').join('')||'Sin negocios'}document.getElementById('usegeo').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{window._lat=p.coords.latitude;window._lng=p.coords.longitude;document.getElementById('msg').textContent='GPS '+window._lat.toFixed(4)+','+window._lng.toFixed(4)})
document.getElementById('save').onclick=()=>{const name=document.getElementById('n').value.trim();if(!name)return alert('Nombre');const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-');const lab=document.getElementById('c').selectedOptions[0].text;cat.businesses.unshift({id,name,category:document.getElementById('c').value,categoryLabel:lab,description:name,lat:window._lat||25.5608,lng:window._lng||-108.4676,address:document.getElementById('a').value,phone:'',whatsapp:document.getElementById('w').value||'522281114501',hours:'Lun-Sab 10-20',status:'Abierto ahora',destacado:false,rating:4.5,reviewCount:0,photos:[],promo:null});S.save(cat);S.applyToWindow(cat);document.getElementById('msg').textContent='Guardado. Abre el directorio en esta misma pestana.';draw()}</script></body></html>
